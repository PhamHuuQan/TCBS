name: syntax-check

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m compileall -q app tests
      - name: JavaScript syntax
        run: node --check app/static/app.js
